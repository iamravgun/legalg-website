<header class="site-header" id="site-header" data-header>
  <div class="utility-bar surface-deep">
    <div class="container utility-bar__inner">
      <ul class="utility-bar__contact">
        <li>
          <a href="tel:{{sitePhoneHref}}">
            <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.5.6.6 0 1 .4 1 1v3.5c0 .6-.4 1-1 1C10.6 21.1 2.9 13.4 2.9 4.1c0-.6.4-1 1-1H7.4c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.5.1.4 0 .8-.2 1L6.6 10.8Z"/></svg>
            <span>{{sitePhone}}</span>
          </a>
        </li>
        <li>
          <a href="{{siteWhatsappHref}}" target="_blank" rel="noopener">
            <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1.3-3.9A8 8 0 1 1 9 18.5L4 20Z"/><path d="M8.5 10.5c.3 1.8 2.2 3.7 4 4"/></svg>
            <span>WhatsApp</span>
          </a>
        </li>
        <li class="utility-bar__email">
          <a href="mailto:{{siteEmailHref}}">
            <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6 8.5 7 8.5-7"/></svg>
            <span>{{siteEmail}}</span>
          </a>
        </li>
      </ul>
      <ul class="utility-bar__links">
        <li><a href="/contact.html">Talk to an Expert</a></li>
        <li><a href="/track.html">Track Your Application</a></li>
        <li><a href="/login.html">Login</a></li>
      </ul>
    </div>
  </div>

  <div class="main-bar">
    <div class="container main-bar__inner">
      <a href="/" class="brand">
        <img src="/assets/img/logo-mark.png" alt="" width="40" height="40" class="brand__mark" />
        <span class="brand__word">Legal<span class="brand__g">G</span></span><span class="visually-hidden"> Associates — home</span>
      </a>

      <nav class="primary-nav" aria-label="Primary">
        <ul class="primary-nav__list" role="menubar" id="primary-nav-list">
<!--BLOCK:categoryTriggers-->
        </ul>
      </nav>

      <div class="main-bar__actions">
        <a href="/contact.html?intent=quote" class="btn btn--primary btn--sm">Get a Quote</a>
      </div>

      <button type="button" class="hamburger" id="hamburger-trigger" aria-expanded="false" aria-controls="mobile-drawer" aria-label="Open menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
  </div>

  <div class="mega-menu" id="mega-menu" hidden>
    <div class="container mega-menu__inner">
      <div class="mega-menu__rails" id="mega-menu-rails">
<!--BLOCK:categoryRails-->
      </div>
      <div class="mega-menu__panels" id="mega-menu-panels" aria-live="off"></div>
    </div>
    <div class="mega-menu__footer">
      <div class="container mega-menu__footer-inner">
        <p class="mega-menu__blurb" id="mega-menu-blurb"></p>
        <a class="mega-menu__viewall" id="mega-menu-viewall" href="/services.html">
          <span id="mega-menu-viewall-text">View all services</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
      </div>
    </div>
  </div>
</header>

<div class="drawer-overlay" id="drawer-overlay" hidden></div>
<div class="mobile-drawer" id="mobile-drawer" role="dialog" aria-modal="true" aria-label="Site menu" hidden>
  <div class="mobile-drawer__header">
    <button type="button" class="mobile-drawer__back" id="drawer-back" aria-label="Back" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <span class="mobile-drawer__breadcrumb" id="drawer-breadcrumb">Menu</span>
    <button type="button" class="mobile-drawer__close" id="drawer-close" aria-label="Close menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="mobile-drawer__body" id="drawer-body">
    <div class="drawer-panel drawer-panel--active" id="drawer-panel-root" data-level="0">
      <ul class="drawer-list">
<!--BLOCK:drawerCategories-->
        <li class="drawer-list__item drawer-list__item--link"><a href="/services.html">Browse all services</a></li>
        <li class="drawer-list__item drawer-list__item--link"><a href="/about.html">About LegalG</a></li>
        <li class="drawer-list__item drawer-list__item--link"><a href="/contact.html">Contact</a></li>
      </ul>
    </div>
    <!-- Levels 2 (groups) and 3 (services) are rendered lazily by nav.js into #drawer-body -->
  </div>
  <div class="mobile-drawer__footer">
    <a href="/contact.html?intent=quote" class="btn btn--primary btn--block">Get a Quote</a>
  </div>
</div>
